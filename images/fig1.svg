<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 345" role="img" aria-label="Box plot phân phối giá" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
<text x="410" y="16" text-anchor="middle" font-size="13" font-style="italic" fill="#1c1c1e">Phân phối log(giá/m²) theo Loại căn hộ và Tình trạng nội thất (raw data, n=6.619)</text>
<!-- y axis: log price 2.5..5.5, height=200, offset y=30..230 -->
<!-- scale: 200/3=66.67px per unit. y_pos=230-(val-2.5)*66.67 -->
