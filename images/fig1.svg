<text x="230" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#22314e">Loại căn hộ</text>
<text x="630" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#22314e">Tình trạng nội thất</text>
<!-- y axis -->
<line x1="40" y1="30" x2="40" y2="230" stroke="#3a3a3a" stroke-width="1.2"/>
<line x1="40" y1="230" x2="820" y2="230" stroke="#e0dbd0" stroke-width="0.5"/>
<!-- y ticks -->
<line x1="36" y1="230" x2="40" y2="230" stroke="#3a3a3a"/><text x="34" y="234" text-anchor="end" font-size="9" fill="#666">2.5</text>
<line x1="36" y1="163" x2="40" y2="163" stroke="#3a3a3a"/><text x="34" y="167" text-anchor="end" font-size="9" fill="#666">3.5</text>
<line x1="36" y1="97"  x2="40" y2="97"  stroke="#3a3a3a"/><text x="34" y="101" text-anchor="end" font-size="9" fill="#666">4.5</text>
<line x1="36" y1="30"  x2="40" y2="30"  stroke="#3a3a3a"/><text x="34" y="34"  text-anchor="end" font-size="9" fill="#666">5.5</text>
<line x1="40" y1="163" x2="820" y2="163" stroke="#e0dbd0" stroke-width="0.5" stroke-dasharray="2,3"/>
<line x1="40" y1="97"  x2="820" y2="97"  stroke="#e0dbd0" stroke-width="0.5" stroke-dasharray="2,3"/>
<!-- y axis label -->
<text x="16" y="130" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90,16,130)">log(giá/m²)</text>
<!-- divider -->
<line x1="430" y1="25" x2="430" y2="235" stroke="#ddd" stroke-width="1"/>
