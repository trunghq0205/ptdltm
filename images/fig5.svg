<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 270" role="img" aria-label="RDD scatter plot" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
<text x="320" y="16" text-anchor="middle" font-size="13" font-style="italic" fill="#1c1c1e">Hồi quy gián đoạn tại ngưỡng 800m — log(giá/m²) theo khoảng cách tới metro</text>
<!-- plot area: x=60..600 (540px = 1600m, so 1m=0.3375px), y=35..235 (200px) -->
<!-- x: distance 0..1600m. Threshold at 800m = x_pos=60+800*0.3375=330 -->
<!-- y: log price range approx 2.5..5.5, scale: 200/(5.5-2.5)=66.67px per unit -->
<!-- y_pos = 235 - (val-2.5)*66.67 -->
<line x1="60" y1="235" x2="600" y2="235" stroke="#3a3a3a" stroke-width="1.2"/>
<line x1="60" y1="35" x2="60" y2="235" stroke="#3a3a3a" stroke-width="1.2"/>
<!-- x axis labels -->
<text x="60"  y="250" text-anchor="middle" font-size="10" fill="#666">0m</text>
<text x="195" y="250" text-anchor="middle" font-size="10" fill="#666">400m</text>
<text x="330" y="250" text-anchor="middle" font-size="10" fill="#666">800m</text>
<text x="465" y="250" text-anchor="middle" font-size="10" fill="#666">1200m</text>
<text x="600" y="250" text-anchor="middle" font-size="10" fill="#666">1600m</text>
<!-- y axis labels -->
<text x="55" y="238" text-anchor="end" font-size="10" fill="#666">2.5</text>
<text x="55" y="172" text-anchor="end" font-size="10" fill="#666">3.5</text>
<text x="55" y="105" text-anchor="end" font-size="10" fill="#666">4.5</text>
<text x="55" y="38" text-anchor="end" font-size="10" fill="#666">5.5</text>
<line x1="60" y1="172" x2="600" y2="172" stroke="#e8e3d8" stroke-width="1" stroke-dasharray="2,3"/>
<line x1="60" y1="105" x2="600" y2="105" stroke="#e8e3d8" stroke-width="1" stroke-dasharray="2,3"/>
<!-- threshold line -->
<line x1="330" y1="35" x2="330" y2="235" stroke="#8a2f2a" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="332" y="48" font-size="10" fill="#8a2f2a">800m</text>
<!-- scatter dots: near side (0-800m), ~359 pts; far side (800-1600m), ~330 pts -->
