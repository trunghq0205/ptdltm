<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 380" role="img" aria-label="So sánh hiệu ứng Model A vs B" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif" font-size="11">
<!-- title -->
<text x="430" y="18" text-anchor="middle" font-size="13" font-style="italic" fill="#1c1c1e">So sánh hiệu ứng (%) — Mô hình A (LinearDML) và Mô hình B (SparseLinearDML)</text>
<!-- axes -->
<!-- zero line at x=200, scale: 1% = 3.6px, range -20..+35 -->
