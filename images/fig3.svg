<line x1="128" y1="32" x2="128" y2="358" stroke="#e0dbd0" stroke-width="1" stroke-dasharray="2,3"/>
<text x="128" y="28" text-anchor="middle" font-size="10" fill="#888">-20</text>
<line x1="164" y1="32" x2="164" y2="358" stroke="#e0dbd0" stroke-width="1" stroke-dasharray="2,3"/>
<text x="164" y="28" text-anchor="middle" font-size="10" fill="#888">-10</text>
<text x="200" y="28" text-anchor="middle" font-size="10" fill="#888">0</text>
<line x1="236" y1="32" x2="236" y2="358" stroke="#e0dbd0" stroke-width="1" stroke-dasharray="2,3"/>
<text x="236" y="28" text-anchor="middle" font-size="10" fill="#888">+10</text>
<line x1="272" y1="32" x2="272" y2="358" stroke="#e0dbd0" stroke-width="1" stroke-dasharray="2,3"/>
<text x="272" y="28" text-anchor="middle" font-size="10" fill="#888">+20</text>
<line x1="308" y1="32" x2="308" y2="358" stroke="#e0dbd0" stroke-width="1" stroke-dasharray="2,3"/>
<text x="308" y="28" text-anchor="middle" font-size="10" fill="#888">+30</text>
