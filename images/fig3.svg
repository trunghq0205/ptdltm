<rect x="560" y="20" width="12" height="10" fill="#1f5c3d" opacity="0.85"/>
<text x="576" y="30" fill="#333">Mô hình A (LinearDML)</text>
<rect x="560" y="36" width="12" height="10" fill="#4a90a4" opacity="0.85"/>
<text x="576" y="46" fill="#333">Mô hình B (SparseLinearDML)</text>
